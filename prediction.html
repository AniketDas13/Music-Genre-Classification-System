<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Music Genre Classification (CNN)</title>
    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="css/styles.css">
    <script>
        function predict() {
            const formData = new FormData();
            const fileField = document.querySelector('input[type="file"]');
            if (!fileField.files.length) {
                alert("Please select a file first!");
                return;
            }
            formData.append('the_file', fileField.files[0]);

            document.getElementById("loader").style.display = "inline-block";
            document.getElementById("genre").innerHTML = "";

            fetch('http://localhost:5000/prediction', {
                method: 'POST',
                body: formData
            })
                .then(response => response.json())
                .then(result => {
                    document.getElementById("loader").style.display = "none";
                    if (result.genre) {
                        document.getElementById("genre").innerHTML =
                            `🎵 Predicted genre: <b>${result.genre}</b>`;
                    } else {
                        document.getElementById("genre").innerHTML =
                            "❌ Prediction failed: " + (result.error || "Unknown error");
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    document.getElementById("loader").style.display = "none";
                    document.getElementById("genre").innerHTML =
                        "⚠️ Can't predict the genre! Check the file type!";
                });
        }
    </script>
</head>

<body>

    <nav class="navbar navbar-dark bg-dark">
        <img src="images/isi-logo.png" height="50px" style="margin-right:10px; border-radius:8px;">
        <a href="#" class="navbar-brand">Music Genre Classification (CNN)</a>
    </nav>

    <div class="container d-flex justify-content-center align-items-center" style="flex:1; padding-top:40px;">
        <div class="card p-4 text-center" style="max-width: 500px; width:100%;">
            <h2 class="mb-3">Upload a Music File</h2>
            <p class="text-muted">Please upload a ~30 second audio clip (WAV preferred)</p>
            <input type="file" id="file_id" style="display:none">
            <div class="d-flex justify-content-center mb-3">
                <button class="btn btn-outline-light btn-custom mr-2"
                    onclick="document.getElementById('file_id').click()">🎶 Browse</button>
                <button class="btn btn-primary btn-custom ml-2" onclick="predict()">🚀 Predict</button>
            </div>
            <div>
                <div id="loader" class="spinner-border text-light" role="status"></div>
                <h4 class="mt-3" id="genre"></h4>
            </div>
        </div>
    </div>

    <footer class="page-footer bg-dark text-center text-white py-2">
        MGCS © 2025 — Powered by CNN + Flask
    </footer>

</body>

</html>
